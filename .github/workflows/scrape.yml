
name: Scrape Play Store Reviews

on:
  schedule:
    - cron: "0 1 1 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Scrape reviews
        run: python scraper.py

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}'
          project_id: gojek-grab-analytics

      - name: Upload new reviews to BigQuery
        run: python upload_to_bigquery.py

      - name: Commit & push data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "actions@github.com"
          git add data/gojek_grab_raw.csv gojek_grab_final.csv
          git commit -m "Auto scrape $(date +'%Y-%m-%d')" || echo "Tidak ada perubahan data"
          git push
